[plugin]
id = "temporal_memory"
name = "时序记忆"
description = "证据优先的分层时序记忆：原话摘录、事件/偏好到期休眠、手动保留不衰减、矛盾先待确认；不自动注入对话，只在需要时按需召回。"
short_description = "原话证据 + 到期休眠 + 冲突待确认的时序记忆，按需召回。"
keywords = ["记忆", "记住", "回忆", "时间线", "之前说过", "上次", "证据", "休眠", "memory", "timeline", "recall", "remember"]
version = "0.5.13"
type = "plugin"
entry = "plugin.plugins.temporal_memory:TemporalMemoryPlugin"

[plugin.author]
name = "1-dcjiang"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "settings"
title = "时序记忆"
entry = "ui/settings.tsx"
mode = "hosted-tsx"
context = "settings"
permissions = ["state:read", "action:call", "config:read"]

[[plugin.ui.guide]]
id = "guide"
title = "使用指南"
entry = "docs/guide.md"
permissions = ["state:read"]

[plugin_runtime]
enabled = true
auto_start = true
timeout = 10

[settings]
enabled = true
working_window = 8
anchor_threshold = 0.3
max_anchor_summary_chars = 140
hot_recall_window_days = 7
cold_after_days = 60
dormancy_event_days = 90
dormancy_preference_days = 180
max_recall_anchors = 6
max_recall_semantics = 12
recall_char_budget = 1200
